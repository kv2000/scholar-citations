name: Update Scholar citations

on:
  schedule:
    # Every Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch citation counts
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain citations.json)" ]]; then
            echo "No changes."
            exit 0
          fi
          git add citations.json
          git commit -m "chore: update citations $(date -u +%Y-%m-%d)"
          # Push with rebase-on-conflict retry — main may have moved between
          # checkout and push (concurrent workflow runs, manual pushes, etc).
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing on origin/main..."
            git pull --rebase origin main || exit 1
          done
          echo "push failed after 3 attempts" >&2
          exit 1
